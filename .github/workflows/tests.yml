name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The gate only reads the repo; it never writes back.
permissions:
  contents: read

jobs:
  pytest:
    # macOS is required, not a preference: pipeline/subject.py imports the
    # Vision/Quartz frameworks via pyobjc, and tests/test_verify.py reads
    # /System/Library/ColorSync/Profiles. Pinned rather than macos-latest so a
    # runner-image rollover can't silently change what the gate ran against.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      # Actions pinned to commit SHAs (tags are mutable), matching the
      # pinning discipline of config/toolchain.lock and requirements-dev.txt.
      # persist-credentials: false because later steps run repo-controlled
      # code (pytest) and must not find a usable git token on disk.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Tests shell out to these for real (tests/test_verify.py,
      # tests/test_pdfs.py).
      - name: Install render tools
        run: brew install --quiet exiftool imagemagick img2pdf qpdf poppler

      # tests/test_metadata.py tags fixtures with toolchain._rt_icc_path(),
      # which resolves RTv4_sRGB.icc inside the app bundle
      # (Contents/Resources/share/iccprofiles/output). The cask is installed
      # for that profile only — the resources dir short-circuits the lookup,
      # so the CLI itself is never executed here.
      - name: Install RawTherapee (ICC profile source)
        run: brew install --quiet --cask rawtherapee

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run quality gate
        run: python -m pytest tests/ -q
