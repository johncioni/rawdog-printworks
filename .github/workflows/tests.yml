name: tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # macOS is required, not a preference: pipeline/subject.py imports the
    # Vision/Quartz frameworks via pyobjc, and tests/test_verify.py reads
    # /System/Library/ColorSync/Profiles. Pinned rather than macos-latest so a
    # runner-image rollover can't silently change what the gate ran against.
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Tests shell out to these for real (tests/test_verify.py,
      # tests/test_pdfs.py).
      - name: Install render tools
        run: brew install --quiet exiftool imagemagick img2pdf qpdf poppler

      # tests/test_metadata.py tags fixtures with toolchain._rt_icc_path(),
      # which resolves RTv4_sRGB.icc inside the app bundle
      # (Contents/Resources/share/iccprofiles/output). The cask is installed
      # for that profile only — the resources dir short-circuits the lookup,
      # so the CLI itself is never executed here.
      - name: Install RawTherapee (ICC profile source)
        run: brew install --quiet --cask rawtherapee

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run quality gate
        run: python -m pytest tests/ -q
